name: Publish

# Publishes through npm trusted publishing: the OIDC token minted below replaces a
# long-lived NPM_TOKEN, and npm attaches the provenance attestation that n8n requires
# for verified community nodes (local publishes are rejected from 2026-05-01 on).
#
# Requires a trusted publisher configured on npmjs.com for this repository and this
# workflow filename.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; the bundled version trails it.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Trusted publishing can only be configured on a package that already exists,
      # so the first release authenticates with a short-lived granular token and asks
      # for provenance explicitly. Once 0.1.0 is on the registry, configure the trusted
      # publisher, drop this env block and the --provenance flag, and revoke the token.
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
